version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: solynk
      POSTGRES_USER: solynk_user
      POSTGRES_PASSWORD: solynk_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    build: .
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379
      - REDIS_ENABLED=true
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: node src/jobs/worker.js
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
